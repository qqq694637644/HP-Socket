          HP-Socket static library build
          Version: 6.0.3.1
          Upstream repository: https://github.com/ldcsaa/HP-Socket
          Upstream tag: v6.0.3
          Upstream commit: 51743f1a05a5c45f6390f116894446c3e6cfcf6b
          Project: Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj
          Configuration: uRelease
          Platform: x64
          Character set: Unicode
          Runtime library: /MT
          Thread-safe local static initialization: Disabled (/Zc:threadSafeInit-)
          Thread-safe helper symbols: Absent (_Init_thread_header, _Init_thread_footer, _Init_thread_epoch)
          TLS index / TLS section: Absent (_tls_index, __tls_used, .tls)
          Source TLS declarations: None (thread_local, __declspec(thread))
          CRT initializer section: .CRT$XCU retained for C++/ATL global initializers; not TLS storage
          TLS/SSL: Disabled (_SSL_DISABLED)
          HTTP: Disabled (_HTTP_DISABLED)
          Brotli: Disabled (_BROTLI_DISABLED)
          Optional archive inputs removed: libssl.lib, libcrypto.lib, brotli.lib
          Preprocessor: HPSOCKET_STATIC_LIB; _SSL_DISABLED; _HTTP_DISABLED; _BROTLI_DISABLED
          Output: HPSocket_U.lib
          Size bytes: $size
          SHA256: $sha
          "@
          Set-Content -LiteralPath 'dist/build-info.txt' -Value $info -Encoding utf8
          Compress-Archive -Path 'dist/*' -DestinationPath 'HPSocket-6.0.3.1-x64-UNICODE-MT-NoTLS-NoThreadSafeInit.zip' -Force
          Get-FileHash -Algorithm SHA256 'HPSocket-6.0.3.1-x64-UNICODE-MT-NoTLS-NoThreadSafeInit.zip' | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HPSocket-6.0.3.1-x64-UNICODE-MT-NoTLS-NoThreadSafeInit
          path: |
            dist/
            HPSocket-6.0.3.1-x64-UNICODE-MT-NoTLS-NoThreadSafeInit.zip
          if-no-files-found: error
          retention-days: 30.FullName -like '*\Hostx64\x64\dumpbin.exe' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }

          $forbiddenSymbols = @(
            & $dumpbin.FullName /symbols $libPath 2>&1 |
