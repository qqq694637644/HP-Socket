        shell: pwsh
        run: |
          $libPath = 'source/Windows/Lib/HPSocket/x64/static/HPSocket_U.lib'
          if (-not (Test-Path -LiteralPath $libPath -PathType Leaf)) {
            Write-Host 'Build output tree:'
            Get-ChildItem -LiteralPath 'source/Windows/Lib' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize
            throw "Expected library not found: $libPath"
          }
          New-Item -ItemType Directory -Force -Path 'dist/include/HPSocket' | Out-Null
          Copy-Item -LiteralPath $libPath -Destination 'dist/HPSocket_U.lib' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPTypeDef.h' -Destination 'dist/include/HPSocket/HPTypeDef.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPSocket.h' -Destination 'dist/include/HPSocket/HPSocket.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/SocketInterface.h' -Destination 'dist/include/HPSocket/SocketInterface.h' -Force
