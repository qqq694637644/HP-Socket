        shell: pwsh
        run: |
          $libPath = 'source/Windows/Lib/HPSocket/x64/static/HPSocket_U.lib'
          if (-not (Test-Path -LiteralPath $libPath -PathType Leaf)) { throw "Library not found: $libPath" }
