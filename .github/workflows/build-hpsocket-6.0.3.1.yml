            $forbiddenSymbols | ForEach-Object { Write-Host $_.Line }
            throw 'MSVC thread-safe static initialization / TLS helper symbols remain in HPSocket_U.lib'
          }

          $tlsSections = @(
            & $dumpbin.FullName /headers $libPath 2>&1 |
              Select-String -Pattern '^\s*[0-9A-F]+\s+\.tls(?:\s|$)'
          )
          $headersExit = $LASTEXITCODE
          if ($headersExit -ne 0) { throw "dumpbin /headers failed with exit code $headersExit" }
          if ($tlsSections.Count -gt 0) {
            $tlsSections | ForEach-Object { Write-Host $_.Line }
            throw 'TLS data section found in HPSocket_U.lib'
          }
          $global:LASTEXITCODE = 0
          Write-Host 'Verified: no _Init_thread_header/_footer/_epoch, _tls_index, __tls_used, or .tls section'
          Write-Host '.CRT$XCU global initializer entries are allowed; they are C++/ATL initializers, not TLS storage'
