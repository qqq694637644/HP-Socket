          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vsRoot 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }

          $forbiddenSymbols = @(
            & $dumpbin.FullName /symbols $libPath 2>&1 |
              Select-String -Pattern '_Init_thread_header|_Init_thread_footer|_Init_thread_epoch|_tls_index|__tls_used'
          )
          $symbolsExit = $LASTEXITCODE
          if ($symbolsExit -ne 0) { throw "dumpbin /symbols failed with exit code $symbolsExit" }
