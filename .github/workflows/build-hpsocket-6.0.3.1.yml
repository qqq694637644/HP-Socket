name: Build HPSocket 6.0.3.1 x64 Unicode Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 Unicode Release
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ldcsaa/HP-Socket
          ref: 51743f1a05a5c45f6390f116894446c3e6cfcf6b
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify source version
        shell: pwsh
        run: |
          $headerPath = "source/Windows/Include/HPSocket/HPTypeDef.h"
          $header = Get-Content -LiteralPath $headerPath -Raw
          $expected = @(
            @{ Name = 'MAJOR'; Value = '6' },
            @{ Name = 'MINOR'; Value = '0' },
            @{ Name = 'REVISE'; Value = '3' },
            @{ Name = 'BUILD'; Value = '1' }
          )
          foreach ($entry in $expected) {
            $pattern = "(?m)^#define\s+HP_VERSION_$($entry.Name)\s+$($entry.Value)(?:\s|$)"
            if ($header -notmatch $pattern) {
              throw "Unexpected HP-Socket version macro: HP_VERSION_$($entry.Name)"
            }
          }
          Write-Host 'Verified HP-Socket version 6.0.3.1'

      - name: Build static library
        shell: pwsh
        run: |
          msbuild "source/Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj" /m /t:Rebuild /p:Configuration=uRelease /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /v:minimal

      - name: Package library and matching headers
        shell: pwsh
        run: |
          $libPath = 'source/Windows/Lib/HPSocket/x64/static/HPSocket_U.lib'
          if (-not (Test-Path -LiteralPath $libPath -PathType Leaf)) {
            Write-Host 'Build output tree:'
            Get-ChildItem -LiteralPath 'source/Windows/Lib' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize
            throw "Expected library not found: $libPath"
          }
          New-Item -ItemType Directory -Force -Path 'dist/include/HPSocket' | Out-Null
          Copy-Item -LiteralPath $libPath -Destination 'dist/HPSocket_U.lib' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPTypeDef.h' -Destination 'dist/include/HPSocket/HPTypeDef.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPSocket.h' -Destination 'dist/include/HPSocket/HPSocket.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/SocketInterface.h' -Destination 'dist/include/HPSocket/SocketInterface.h' -Force
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/HPSocket_U.lib').Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath 'dist/HPSocket_U.lib').Length
          $info = @"
          HP-Socket static library build
          Version: 6.0.3.1
          Upstream repository: https://github.com/ldcsaa/HP-Socket
          Upstream tag: v6.0.3
          Upstream commit: 51743f1a05a5c45f6390f116894446c3e6cfcf6b
          Project: Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj
          Configuration: uRelease
          Platform: x64
          Character set: Unicode
          Runtime library: /MT
          Preprocessor: HPSOCKET_STATIC_LIB
          Output: HPSocket_U.lib
          Size bytes: $size
          SHA256: $sha
          "@
          Set-Content -LiteralPath 'dist/build-info.txt' -Value $info -Encoding utf8
          Compress-Archive -Path 'dist/*' -DestinationPath 'HPSocket-6.0.3.1-x64-UNICODE-Release.zip' -Force
          Get-FileHash -Algorithm SHA256 'HPSocket-6.0.3.1-x64-UNICODE-Release.zip' | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HPSocket-6.0.3.1-x64-UNICODE-Release
          path: |
            dist/
            HPSocket-6.0.3.1-x64-UNICODE-Release.zip
          if-no-files-found: error
          retention-days: 30