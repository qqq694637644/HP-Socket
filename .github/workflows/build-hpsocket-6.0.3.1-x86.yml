name: Build HPSocket 6.0.3.1 x86 Unicode Release (MT, No TLS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC Win32 x86 Unicode Release (/MT)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ldcsaa/HP-Socket
          ref: 51743f1a05a5c45f6390f116894446c3e6cfcf6b
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify source version
        shell: pwsh
        run: |
          $headerPath = "source/Windows/Include/HPSocket/HPTypeDef.h"
          $header = Get-Content -LiteralPath $headerPath -Raw
          $expected = @(
            @{ Name = 'MAJOR'; Value = '6' },
            @{ Name = 'MINOR'; Value = '0' },
            @{ Name = 'REVISE'; Value = '3' },
            @{ Name = 'BUILD'; Value = '1' }
          )
          foreach ($entry in $expected) {
            $pattern = "(?m)^#define\s+HP_VERSION_$($entry.Name)\s+$($entry.Value)(?:\s|$)"
            if ($header -notmatch $pattern) {
              throw "Unexpected HP-Socket version macro: HP_VERSION_$($entry.Name)"
            }
          }
          Write-Host 'Verified HP-Socket version 6.0.3.1'

      - name: Apply local feature configuration (no TLS)
        shell: pwsh
        run: |
          $headerPath = 'source/Windows/Include/HPSocket/HPTypeDef.h'
          $header = Get-Content -LiteralPath $headerPath -Raw
          $flags = @('_SSL_DISABLED', '_HTTP_DISABLED', '_BROTLI_DISABLED')
          $missing = @()
          foreach ($flag in $flags) {
            $pattern = '(?m)^#define\s+' + [regex]::Escape($flag) + '\b'
            if ($header -notmatch $pattern) { $missing += $flag }
          }
          if ($missing.Count -gt 0) {
            $versionLine = [regex]::Match($header, '(?m)^#define\s+HP_VERSION_BUILD[^\r\n]*')
            if (-not $versionLine.Success) { throw 'HP_VERSION_BUILD marker not found' }
            $macroLines = @($missing | ForEach-Object { "#define $_" })
            $insertText = "`r`n" + ($macroLines -join "`r`n")
            $header = $header.Insert($versionLine.Index + $versionLine.Length, $insertText)
          }
          foreach ($flag in $flags) {
            $pattern = '(?m)^#define\s+' + [regex]::Escape($flag) + '\b'
            if ($header -notmatch $pattern) { throw "Failed to define $flag" }
          }
          [System.IO.File]::WriteAllText($headerPath, $header, [System.Text.UTF8Encoding]::new($false))

          $projectPath = 'source/Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj'
          [xml]$project = Get-Content -LiteralPath $projectPath -Raw
          $group = @($project.Project.ItemDefinitionGroup | Where-Object { $_.Condition -like '*uRelease|x64*' })
          if ($group.Count -ne 1) { throw "Expected one uRelease|x64 ItemDefinitionGroup; found $($group.Count)" }
          $before = [string]$group[0].Lib.AdditionalDependencies
          $remove = @('libssl.lib', 'libcrypto.lib', 'brotli.lib')
          $after = @($before -split ';' | Where-Object { $_ -and ($remove -notcontains $_.Trim()) })
          $group[0].Lib.AdditionalDependencies = $after -join ';'
          $project.Save($projectPath)
          $remaining = [string]$group[0].Lib.AdditionalDependencies
          if ($remaining -match 'libssl\.lib|libcrypto\.lib|brotli\.lib') { throw "Disabled feature dependencies remain: $remaining" }
          Write-Host "Feature flags: _SSL_DISABLED; _HTTP_DISABLED; _BROTLI_DISABLED"
          Write-Host "Removed optional archive inputs: $($remove -join ', ')"
      - name: Build static library
        shell: pwsh
        run: |
          msbuild "source/Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj" /m /t:Rebuild /p:Configuration=uRelease /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /v:minimal

      - name: Package library and matching headers
        shell: pwsh
        run: |
          $libPath = 'source/Windows/Lib/HPSocket/x86/static/HPSocket_U.lib'
          if (-not (Test-Path -LiteralPath $libPath -PathType Leaf)) {
            Write-Host 'Build output tree:'
            Get-ChildItem -LiteralPath 'source/Windows/Lib' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize
            throw "Expected library not found: $libPath"
          }
          New-Item -ItemType Directory -Force -Path 'dist/include/HPSocket' | Out-Null
          Copy-Item -LiteralPath $libPath -Destination 'dist/HPSocket_U.lib' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPTypeDef.h' -Destination 'dist/include/HPSocket/HPTypeDef.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/HPSocket.h' -Destination 'dist/include/HPSocket/HPSocket.h' -Force
          Copy-Item -LiteralPath 'source/Windows/Include/HPSocket/SocketInterface.h' -Destination 'dist/include/HPSocket/SocketInterface.h' -Force
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/HPSocket_U.lib').Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath 'dist/HPSocket_U.lib').Length
          $info = @"
          HP-Socket static library build
          Version: 6.0.3.1
          Upstream repository: https://github.com/ldcsaa/HP-Socket
          Upstream tag: v6.0.3
          Upstream commit: 51743f1a05a5c45f6390f116894446c3e6cfcf6b
          Project: Windows/Project/HPSocketLIB-2022/HPSocketLIB.vcxproj
          Configuration: uRelease
          Platform: Win32 (x86)
          Character set: Unicode
          Runtime library: /MT
          TLS: Disabled (_SSL_DISABLED)
          HTTP: Disabled (_HTTP_DISABLED)
          Brotli: Disabled (_BROTLI_DISABLED)
          Optional archive inputs removed: libssl.lib, libcrypto.lib, brotli.lib
          Preprocessor: HPSOCKET_STATIC_LIB; _SSL_DISABLED; _HTTP_DISABLED; _BROTLI_DISABLED
          Output: HPSocket_U.lib
          Size bytes: $size
          SHA256: $sha
          "@
          Set-Content -LiteralPath 'dist/build-info.txt' -Value $info -Encoding utf8
          Compress-Archive -Path 'dist/*' -DestinationPath 'HPSocket-6.0.3.1-x86-UNICODE-Release-NoTLS.zip' -Force
          Get-FileHash -Algorithm SHA256 'HPSocket-6.0.3.1-x86-UNICODE-Release-NoTLS.zip' | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HPSocket-6.0.3.1-x86-UNICODE-Release-NoTLS
          path: |
            dist/
            HPSocket-6.0.3.1-x86-UNICODE-Release-NoTLS.zip
          if-no-files-found: error
          retention-days: 30